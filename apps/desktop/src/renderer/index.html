<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>GP</title>
    <style>
      :root {
        --bg: #0d0f12;
        --panel: #161a1f;
        --line: #252b33;
        --text: #e6e8eb;
        --muted: #8a939e;
        --good: #3ccf6e;
        --warn: #f2b33d;
        --bad: #ef4b4b;
        --purple: #b36cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      header h1 { font-size: 15px; margin: 0; letter-spacing: 0.08em; }
      .pill { padding: 2px 8px; border-radius: 999px; background: var(--panel); color: var(--muted); }
      .pill.live { color: var(--good); }
      .pill.paused { color: var(--warn); }
      .pill.garage { color: var(--warn); }
      .pill.no-data { color: var(--bad); }
      .spacer { flex: 1; }
      button {
        background: var(--panel); color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
      }
      button.on { border-color: var(--bad); color: var(--bad); }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
      section h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 6px; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 12px; }
      .k { color: var(--muted); font-size: 11px; }
      .v { font-size: 15px; }
      .big { font-size: 22px; }
      table { width: 100%; border-collapse: collapse; }
      td, th { padding: 2px 4px; text-align: left; }
      th { color: var(--muted); font-weight: normal; font-size: 11px; }
      tr.me td { color: var(--purple); }
      .invalid { color: var(--bad); }
      .muted { color: var(--muted); }
      textarea, input, select {
        width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px; font: inherit;
      }
      textarea { min-height: 120px; resize: vertical; }
      .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .row select { width: auto; }
      .note { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
      .note .t { flex: 1; }
      .note button { padding: 0 8px; }
      .sess { padding: 4px 0; border-bottom: 1px solid var(--line); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>GP</h1>
      <span id="status" class="pill no-data">no-data</span>
      <span id="pps" class="pill">0 pkt/s</span>
      <span class="spacer"></span>
      <button id="tab">Notes</button>
      <button id="ontop">Pin</button>
      <button id="rec">Record</button>
    </header>
    <div id="notesView" class="hidden">
      <section>
        <h2>GP's read on you</h2>
        <div class="k" id="profileMeta"></div>
        <textarea id="profile" placeholder="Builds up after your first few sessions. You can write or correct it yourself."></textarea>
        <div class="row"><span class="spacer"></span><span class="k" id="profileSaved"></span><button id="profileSave">Save</button></div>
      </section>
      <section>
        <h2>Notes GP remembers</h2>
        <div id="notesList" class="muted">-</div>
        <div class="row">
          <select id="noteCat">
            <option>driving</option><option>setup</option><option>radio</option>
            <option>strategy</option><option>personal</option><option>track</option>
          </select>
          <input id="noteTrack" placeholder="track (track notes only)" style="width: 200px" />
        </div>
        <div class="row"><input id="noteText" placeholder="Something GP should remember" /><button id="noteAdd">Add</button></div>
      </section>
      <section><h2>Recent sessions</h2><div id="sessions" class="muted">-</div></section>
    </div>
    <div id="raceView">
    <section id="session"><h2>Session</h2><div class="muted">Waiting for F1 23 telemetry on UDP 20777...</div></section>
    <section id="player"><h2>Car</h2><div class="muted">No car data yet.</div></section>
    <section id="laps"><h2>Laps</h2><div class="muted">No completed laps.</div></section>
    <section id="order"><h2>Order</h2><div class="muted">-</div></section>
    <section id="diag"><h2>Listener</h2><div class="muted">-</div></section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
