<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <title>GP radio</title>
    <link rel="stylesheet" href="gp-ui.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body.gp-app {
        background: transparent;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: color-mix(in srgb, var(--gp-color-surface) 94%, transparent);
        border: 1px solid var(--gp-color-edge);
        border-radius: var(--gp-radius-md);
        overflow: hidden;
      }
      .bar {
        -webkit-app-region: drag;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--gp-space-2) var(--gp-space-4);
        border-bottom: 1px solid var(--gp-color-border);
      }
      .bar .ver {
        color: var(--gp-color-text-faint);
        letter-spacing: 0.04em;
        text-transform: none;
        font-weight: var(--gp-font-regular);
        margin-left: var(--gp-space-2);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: var(--gp-space-4);
        display: flex;
        flex-direction: column;
        gap: var(--gp-space-3);
      }
      .msg .who {
        display: block;
        margin-bottom: 2px;
      }
      .msg .who:empty {
        display: none;
      }
      .gp .who,
      .radio .who {
        color: var(--gp-color-text);
      }
      .you .text {
        color: var(--gp-color-text-muted);
      }
      .err .who,
      .err .text {
        color: var(--gp-color-bad);
      }
      .meta {
        display: block;
        margin-top: 2px;
        color: var(--gp-color-text-faint);
        font-size: var(--gp-type-caption-size);
        line-height: var(--gp-type-caption-line);
      }
      form {
        display: flex;
        border-top: 1px solid var(--gp-color-border);
      }
      input {
        flex: 1;
        border: 0;
        outline: 0;
        padding: var(--gp-space-3) var(--gp-space-4);
        background: transparent;
        color: var(--gp-color-text);
        font: inherit;
      }
      input:focus-visible {
        outline: none;
      }
      input::placeholder {
        color: var(--gp-color-text-faint);
      }
    </style>
  </head>
  <body class="gp-app">
    <div class="shell">
      <div class="bar"><span class="gp-label">GP radio<span id="ver" class="ver"></span></span><span class="gp-label">Esc to hide</span></div>
      <div id="log"></div>
      <form id="form"><input id="input" placeholder="Talk to GP…" autocomplete="off" autofocus /></form>
    </div>
    <script src="chat.js"></script>
  </body>
</html>
