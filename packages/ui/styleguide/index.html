<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>GP design system</title>
    <link rel="stylesheet" href="gp-ui.css" />
    <style>
      /* Style-guide layout only. */
      body { padding-bottom: 80px; }
      .sg-top { display: flex; align-items: center; gap: 12px; padding: 14px 32px; border-bottom: 1px solid var(--gp-color-border); }
      .sg-wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
      .sg-sec { padding: 40px 0 0; }
      .sg-h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; text-transform: uppercase; }
      .sg-h3 { margin: 28px 0 12px; }
      .lead { margin: 0 0 20px; color: var(--gp-color-text-muted); max-width: 80ch; }
      .sg-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .sg-swatch { border: 1px solid var(--gp-color-border); border-radius: 6px; overflow: hidden; background: var(--gp-color-surface); }
      .sg-swatch .chip { height: 44px; }
      .sg-swatch .meta { padding: 6px 8px; font-size: 11px; line-height: 15px; }
      .sg-swatch .meta span, .sg-swatch code { color: var(--gp-color-text-muted); font-family: var(--gp-font-mono); font-size: 10.5px; }
      .sg-type { display: grid; grid-template-columns: 180px 1fr; gap: 14px 20px; align-items: center; }
      .sg-type code { font-family: var(--gp-font-mono); font-size: 11px; color: var(--gp-color-text-faint); }
      .sg-cards { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
      .sg-game { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
        background: linear-gradient(180deg, #d9dcd6 0%, #f3f2ea 34%, #6f746c 34%, #4a4d48 60%, #2a2b29 100%); }
      .sg-ov { position: absolute; right: 2.5%; top: 8%; }
    </style>
  </head>
  <body class="gp-app">
    <div id="root"></div>
    <script src="styleguide.js"></script>
  </body>
</html>
